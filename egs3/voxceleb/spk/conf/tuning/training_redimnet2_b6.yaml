##########################################################
#                    TRAINING SETTING                    #
##########################################################
# ReDimNet2-b6 on VoxCeleb 1+2 dev, both bands, three speeds.
#
# Quick usage:
#   python run.py --stages train infer measure \
#       --training_config conf/tuning/training_redimnet2_b6.yaml
#
# The `create_dataset` stage cannot produce this training set. It derives
# manifests by scanning a VoxCeleb source tree, and has no notion of a
# band-limited copy or a speed-perturbed one. The twelve splits below come from
# kanzi's `build_manifests.py`, which reads the baked Parquet metadata where
# every utterance already carries its correct speaker label.
#
# Architecture matches the reference b6 (`applications/speaker_rec/examples/
# vox2/recipes/redimnet2/b6/ptn.yaml` in PalabraAI/redimnet2): 12.3M parameters,
# 0.287% EER on Vox1-O when trained on VoxCeleb2-dev alone.
#
# One deliberate departure from the reference, documented below: the loss.
# ESPnet has no SphereFace2, so this uses `aamsoftmax_sc_topk`. The reference's
# margin schedule is now reproduced (see `trainer.callbacks`).

num_device: 4

##########################################################
#                    DATASET DEFINITION                  #
##########################################################
# Twelve splits: {voxceleb1, voxceleb2} x {wb, nb} x {1.0, 0.9, 1.1}.
# `CombinedDataset` merges them, so there is no combined manifest to rebuild
# when the mix changes -- add or remove a line here.
#
# The band contributes no new speaker class and the speed does: a speaker heard
# over a phone is the same speaker, whereas a resampled one is treated as a new
# one. That is what makes 1,211 + 5,994 speakers into 21,615 classes, and it is
# why `preprocessor.spk2utt` must point at the union rather than at any single
# split.
dataset:
  train:
    - data_src_args:
        split: voxceleb1_wb
    - data_src_args:
        split: voxceleb1_wb_sp09
    - data_src_args:
        split: voxceleb1_wb_sp11
    - data_src_args:
        split: voxceleb1_nb
    - data_src_args:
        split: voxceleb1_nb_sp09
    - data_src_args:
        split: voxceleb1_nb_sp11
    - data_src_args:
        split: voxceleb2_wb
    - data_src_args:
        split: voxceleb2_wb_sp09
    - data_src_args:
        split: voxceleb2_wb_sp11
    - data_src_args:
        split: voxceleb2_nb
    - data_src_args:
        split: voxceleb2_nb_sp09
    - data_src_args:
        split: voxceleb2_nb_sp11
  valid:
    # Vox1-O every epoch, on the untouched 40-speaker test split. A strided
    # subset keeps validation from dominating epoch time; the `infer` stage
    # scores all 37,611 trials.
    - data_src_args:
        split: voxceleb1_test
        trials: vox1_o
        num_trials: 10000

  preprocessor:
    # The label space spanning all twelve training splits. Its line count is
    # `model.spk_num` below, and a mismatch is a silent accuracy bug.
    spk2utt: ${data_dir}/vox12_dualband_sp/spk2utt
    noise_apply_prob: 0.5
    noise_info:
      - [1.0, "${data_dir}/musan_speech.scp", [4, 7], [13, 20]]
      - [1.0, "${data_dir}/musan_noise.scp", [1, 1], [0, 15]]
      - [1.0, "${data_dir}/musan_music.scp", [1, 1], [5, 15]]
    rir_apply_prob: 0.5
    rir_scp: ${data_dir}/rirs.scp
    # 2-second crops, matching the reference's `num_frms: 200` at a 10 ms hop.
    # The TEMPLATE default is 3.0; b6's activations are large enough that the
    # extra second is not free.
    target_duration: 2.0

create_dataset:
  recipe_dir: ${recipe_dir}

##########################################################
#                      MODEL SETTING                     #
##########################################################
model:
  # 1,211 (VoxCeleb1 dev) + 5,994 (VoxCeleb2 dev) = 7,205 speakers, tripled by
  # the three speeds. The two bands add nothing. Must equal
  # `wc -l < data/vox12_dualband_sp/spk2utt`.
  spk_num: 21615

  # ReDimNet2 owns its own feature extractor -- `TFMelBanks` when
  # `feat_type: tf` -- so the task-level frontend is disabled rather than
  # producing filterbanks the encoder would ignore.
  frontend: null

  encoder: redimnet2
  encoder_conf:
    # Verbatim from the reference b6 recipe.
    F: 72
    C: 64
    embed_dim: 192
    out_channels: 224
    feat_type: tf
    hop_length: 160
    block_1d_type: conv+att
    block_2d_type: basic_resnet
    return_2d_output: true
    agg_gnorm: true
    compress_tconvs: true
    fm_weigthing_type: NC
    group_divisor: 1
    spec_in_channels: 1
    causal: none
    spec_params:
      do_preemph: true
      norm_signal: true
      # Spectral augmentation is off: MUSAN and RIR augmentation already run in
      # the preprocessor, and the reference leaves this off too.
      do_spec_aug: false
    stages_setup:
      - [[1, 1], 3, 3, [[3, 3]], 64]
      - [[2, 1], 4, 2, [[3, 3]], 64]
      - [[1, 2], 5, 2, [[3, 3]], 48]
      - [[2, 1], 5, 1, [[3, 3]], 48]
      - [[1, 2], 4, 0.75, [[3, 3]], 32]
      - [[2, 1], 3, 0.5, [[3, 3]], 24]

  # ReDimNet2's attentive statistics pooling. NOT `chn_attn_stat`, which inserts
  # a BatchNorm and uses ReLU where this uses tanh; their state dicts are
  # incompatible and the released weights will not load into it.
  pooling: astp
  pooling_conf:
    bottleneck_dim: 128
    global_context_att: true
  # `input_size` is intentionally absent here and below: the task derives them
  # from `encoder.output_size()` and `pooling.output_size()`.

  projector: rawnet3
  projector_conf:
    output_size: 192

  # DEPARTURE FROM THE REFERENCE: b6 uses SphereFace2 (`project_type:
  # sphereface2`, `margin_type: C`, scale 32, lambda 0.7, t 3). ESPnet offers
  # only aamsoftmax, aamsoftmax_sc_topk and softmax, so this starts from
  # sub-center AAM-softmax with inter-top-k. Expect to be behind the published
  # number until SphereFace2 exists here.
  loss: aamsoftmax_sc_topk
  loss_conf:
    margin: 0.3
    scale: 30
    K: 3
    mp: 0.06
    k_top: 5

##########################################################
#            OPTIMIZER & SCHEDULER SETTING               #
##########################################################
# `optimizer:` with a `_target_`, NOT espnet2's `optim:`/`optim_conf:`. This
# recipe originally used the latter, and espnet3 silently ignored it -- the
# resolved config carried both a dead `optim: adam` key and the TEMPLATE's
# default Adam, so the file claimed one optimiser and the run used another.
#
# SGD with Nesterov momentum at lr 0.1 is the reference b6 recipe's choice, not
# the Adam inherited from RawNet3. Effective batch matches too: the reference
# runs batch 140 per GPU on 8 GPUs, and so does this.
optimizer:
  _target_: torch.optim.SGD
  lr: 0.1
  momentum: 0.9
  nesterov: true
  weight_decay: 0.00002

# One cosine cycle over the whole run, not warm restarts.
#
# The reference uses ExponentialDecrease from 0.1 to 6e-5 with six epochs of
# warm-up from zero and no restarts. Cosine and exponential differ in shape but
# both are monotone decays between the same endpoints, which is far closer to
# the reference than the RawNet3 recipe's repeated restarts with gamma decay.
#
# `first_cycle_steps` and `warmup_steps` are in OPTIMISER STEPS -- the TEMPLATE
# sets `scheduler_interval: step` -- so both depend on batch size AND device
# count: steps/epoch = utterances / (batch_size * num_device). Hardcoding them
# is how this recipe came to carry a value computed for 4 devices while the job
# ran on 8, making a nominal 10-epoch cycle a 20-epoch one. train_run.sh now
# derives both from the actual run parameters and overwrites what is here, so
# these values are a readable default rather than the source of truth.
scheduler:
  _target_: espnet2.schedulers.cosine_anneal_warmup_restart.CosineAnnealingWarmupRestarts
  # 80 epochs x 6,646 steps/epoch at batch 140 on 8 devices.
  first_cycle_steps: 531680
  cycle_mult: 1.0
  max_lr: 0.1
  min_lr: 0.00006
  # Six epochs, matching the reference's `warm_up_epoch: 6`.
  warmup_steps: 39876
  # Irrelevant with a single cycle; 1.0 makes that explicit.
  gamma: 1.0

##########################################################
#                    TRAINER SETTING                     #
##########################################################
trainer:
  # The reference trains b6 for 120 epochs; 40 is inherited from the RawNet3
  # recipe and is a starting point, not a reproduction.
  max_epochs: 40
  # precision: bf16-mixed comes from the TEMPLATE, matching the reference's
  # enable_amp. Stated here because b6 does not fit without it.
  # Vox1-O EER after every epoch, which is what checkpoint selection uses.
  check_val_every_n_epoch: 1

  # BOTH callbacks must be listed here. This key replaces the TEMPLATE's list
  # rather than extending it -- OmegaConf merges mappings deeply but overwrites
  # sequences -- so omitting SpeakerVerificationScoring would silently stop
  # `valid/eer` from ever being logged, and `best_model_criterion` selects on
  # it.
  callbacks:
    - _target_: espnet3.systems.spk.callbacks.SpeakerVerificationScoring
      p_target: 0.05
      c_miss: 1.0
      c_fa: 1.0
    # The reference ramps the margin instead of training at its final value
    # from step 0 (`MarginScheduler` in wespeaker_lite): held at 0, raised
    # between epochs 20 and 40, fixed after. `final_margin` must equal
    # `model.loss_conf.margin` below -- the schedule overwrites the margin
    # every step, so a different value there would be dead config. The
    # callback warns if the two disagree.
    - _target_: espnet3.systems.spk.callbacks.MarginScheduler
      initial_margin: 0.0
      final_margin: 0.3
      increase_start_epoch: 20
      fix_start_epoch: 40
      increase_type: exp

dataloader:
  train:
    # 140, from the reference b6 recipe -- not RawNet3's 256. b6 is 13.05 GMACs
    # and inheriting the larger batch ran a 139.8 GiB H200 out of memory inside
    # the backbone's `upsample_nearest1d`, even with bf16 on:
    #   torch.OutOfMemoryError: Tried to allocate 1.30 GiB
    # The reference scales it by model size: b0 512, b2 192, b6 140.
    batch_size: 140
    num_workers: 8
    shuffle: true
    drop_last: true
    pin_memory: true
    # Forked workers inherit an initialised CUDA context and abort with
    # `CUDA error: initialization error`. num_workers=0 avoids it but starves
    # the GPU (measured at 0% utilisation), so spawn is the only setting that
    # keeps the loader both parallel and alive.
    multiprocessing_context: spawn
    # Spawned workers re-import the world; keeping them alive amortises it.
    persistent_workers: true
  valid:
    batch_size: 16
    num_workers: 4
    shuffle: false
    drop_last: false
    pin_memory: true
    multiprocessing_context: spawn
    persistent_workers: true

# The margin schedule is set, under `trainer.callbacks` above. ESPnet ships
# nine learning-rate schedulers and had no margin scheduler, so `MarginScheduler`
# was added to `espnet3/systems/spk/callbacks.py` to reproduce the reference's
# ramp (saturating exponential, stepped per iteration, 1-indexed epochs).
